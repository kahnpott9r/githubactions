name: CI

# Khi nào pipeline chạy?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mặc định chỉ được đọc code, không được ghi gì vào repo.
permissions:
  contents: read

env:
  APP_NAME: ci-cd-playground

jobs:
  # ---------------------------------------------------------------
  # Job 1: chạy test trên nhiều phiên bản Node (matrix build)
  # ---------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  # ---------------------------------------------------------------
  # Job 2: chỉ chạy khi test xanh -> build & upload artifact
  # ---------------------------------------------------------------
  build:
    name: Build & package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Show build info
        run: cat dist/build-info.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: build Docker image -> push lên GHCR (chỉ khi push vào main)
  #        PR: chỉ build để kiểm tra Dockerfile, không push.
  # ---------------------------------------------------------------
  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # cần để push image lên ghcr.io bằng GITHUB_TOKEN
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 🐳 Docker image"
            echo "Pushed: \`${PUSH_IMAGE}\`"
            echo '```'
            echo "${IMAGE_TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Job 4: báo cho repo githubactions_java chạy integration test
  #        với đúng commit Node vừa build xong (chỉ khi push lên main)
  # ---------------------------------------------------------------
  notify-java:
    name: Trigger Java integration tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Send repository_dispatch to githubactions_java
        env:
          # Fine-grained PAT, chỉ cấp cho repo githubactions_java,
          # quyền "Contents: Read and write" (bắt buộc cho repository_dispatch).
          GH_TOKEN: ${{ secrets.JAVA_REPO_DISPATCH_TOKEN }}
          JAVA_REPO: kahnpott9r/githubactions_java
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Chưa cấu hình secret JAVA_REPO_DISPATCH_TOKEN -> bỏ qua trigger repo Java."
            exit 0
          fi
          gh api "repos/${JAVA_REPO}/dispatches" \
            -f event_type=node-app-updated \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[run_url]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "✅ Đã trigger CI của ${JAVA_REPO} với Node commit ${GITHUB_SHA::7}"
