name: CI

# Khi nào pipeline chạy?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mặc định chỉ được đọc code, không được ghi gì vào repo.
permissions:
  contents: read

env:
  APP_NAME: ci-cd-playground

jobs:
  # ---------------------------------------------------------------
  # Job 1: chạy test trên nhiều phiên bản Node (matrix build)
  # ---------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  # ---------------------------------------------------------------
  # Job 2: chỉ chạy khi test xanh -> build & upload artifact
  # ---------------------------------------------------------------
  build:
    name: Build & package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Show build info
        run: cat dist/build-info.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-${{ github.sha }}
          path: dist
          retention-days: 7
