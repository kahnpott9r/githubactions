

name: Day 01 - first workflow


on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  hello:
    name: hello Github Actions
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: echo 'Hello Github Actions'
   
      - name: print current directory
        run: pwd

      - name: print system information
        run: uname -a

      - name: print current date
        run: date

