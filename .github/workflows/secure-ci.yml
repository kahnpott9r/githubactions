
name: Secure CI pipeline


on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:


permissions:
  contents: read


env:
  APP_NAME: github_action-bootcamp
  APP_ENV: development


jobs:
  context:
    name: Context inspection
    runs-on: ubuntu-latest
    
    steps:
      - name: print github context
        env:
          REPO: ${{ github.repository  }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENVENT: ${{ github.event_name }}
        run: |
          echo 'repo: $REPO'
          echo 'actor: $ACTOR'
          echo 'branch: $BRANCH'
          echo 'event: $EVENT'

  build:
    name: Build application
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: production


    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22


      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test

      - name: build
        run: npm run build

      - name: build summary
        if: success()
        run: |
          echo 'application: $APP_NAME'
          echo 'enviroment: $APP_ENV'
          echo 'Node: $NODE_ENV'

      - name: failure notification
        if: failure()
        run: echo 'build failed!'




      








